# Enable mouse support
set -g mouse on

# Increase history limit
set -g history-limit 100000

# Switch sessions instead of detaching when one is destroyed
set -g detach-on-destroy off

# Pass Shift+Enter and other modified keys through to apps like Claude Code
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Let terminal notifications from Claude Code reach the outer terminal
set -g allow-passthrough on

# Keep inline images in Neovim (snacks.nvim) from being disturbed
set -g visual-activity off

# Tell apps when their pane gains or loses focus
set -g focus-events on

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'wfxr/tmux-fzf-url'
# Keep continuum last so it can add its autosave hook to status-right
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence
set -g @continuum-save-interval '15'
set -g @resurrect-processes 'claude codex opencode'
set -g @resurrect-hook-post-save-layout '~/.local/bin/tmux-resurrect-agent-save'

# Catppuccin theme (installed outside TPM to avoid a plugin name clash)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background '#{@thm_bg}'
run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

# Each tab is a number block and a name block. The number block's color shows
# the agent state (blue working, yellow waiting, green done, red error, gray none),
# and the current tab's name block is white with dark bold text.
set -g @tab_state_color '#{?#{==:#{@agent_status},working},#{@thm_blue},#{?#{==:#{@agent_status},waiting},#{@thm_yellow},#{?#{==:#{@agent_status},done},#{@thm_green},#{?#{==:#{@agent_status},error},#{@thm_red},#{@thm_overlay_2}}}}}'
set -g window-status-separator ' '
set -gw window-status-format '#[fg=#{@thm_crust},bg=#{E:@tab_state_color},bold] #I #[fg=#{@thm_subtext_0},bg=#{@thm_surface_0},nobold] #W '
set -gw window-status-current-format '#[fg=#{@thm_crust},bg=#{E:@tab_state_color},bold] #I #[fg=#{@thm_crust},bg=#{@thm_fg},bold] #W '

# Session name on a mauve block on the right, red while the prefix is active.
# Set before TPM runs so continuum can prepend its autosave hook.
set -g status-interval 5
set -g status-left ' '
set -g status-right '#[fg=#{@thm_crust},bg=#{?client_prefix,#{@thm_red},#{@thm_mauve}},bold] #S '
set -g status-right-length 100

# Messages and the command prompt cover the whole bar, so tabs do not show through
set -gF message-style 'bg=#{@thm_surface_0},fg=#{@thm_fg},fill=#{@thm_surface_0},width=100%'
set -gF message-command-style 'bg=#{@thm_surface_0},fg=#{@thm_mauve},fill=#{@thm_surface_0},width=100%'

# Clear highlight for the selected row in session and window lists (and copy mode)
set -gF mode-style 'bg=#{@thm_mauve},fg=#{@thm_crust},bold'

# Improve yank behavior
set -g @yank_selection 'clipboard'
set -g @yank_with_mouse on
set -g set-clipboard on

# Open new window in the current directory
bind c new-window -c "#{pane_current_path}"

# Split panes in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Open Lazygit in a popup from the current directory
bind G display-popup -E -w 95% -h 95% -d "#{pane_current_path}" lazygit

# Remove default split bindings
unbind '"'
unbind %

# Resize panes with Option + Shift + Arrow Keys
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5

# Navigate panes with prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Tree views show agent state as a dot in its color (blue working, yellow waiting,
# green done, red error, gray ready). Claude's process is named after its
# version, so it shows as claude.
set -g @tree_pane_format '#{?@agent_status,#[fg=#{E:@tab_state_color}]●#[default] ,}#{?#{m/r:^[0-9.]+$,#{pane_current_command}},claude,#{pane_current_command}}  #{b:pane_current_path}'
set -g @tree_window_format '#{?#{m/r:^[0-9.]+$,#{window_name}},claude,#{window_name}}#{?@agent_status, #[fg=#{E:@tab_state_color}]●#[default],}'

# Agent picker: every pane running an agent, across all sessions
bind a { choose-tree -Z -f '#{!=:#{@agent_status},}' -F '#{?pane_format,#{E:@tree_pane_format},#{?window_format,#{E:@tree_window_format},}}' }

# Session list (prefix s): session rows show only the name (and whether you are
# attached); windows and panes appear when a session is expanded
bind s { choose-tree -Zs -F '#{?pane_format,#{E:@tree_pane_format},#{?window_format,#{E:@tree_window_format},#{?session_attached,#[fg=#{@thm_mauve}](attached)#[default],}}}' }

# Jump to the next agent that is waiting for you, or else one that is done
bind Space run-shell '~/.local/bin/tmux-agent-next'

# Reset a finished Claude Code pane to ready once it gets focus
set-hook -g pane-focus-in 'if -F "#{==:#{@agent_status},done}" "run-shell \"TMUX_PANE=#{pane_id} ~/.local/bin/tmux-agent-status ready </dev/null\""'
