# Enable mouse support
set -g mouse on

# Increase history limit
set -g history-limit 100000

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'wfxr/tmux-fzf-url'

# Dracula theme configuration
# Empty space disables Dracula default right-side widgets:
# battery, network, weather
set -g @dracula-plugins " "
set -g status-right ""
set -g @dracula-show-left-icon ""

# Improve yank behavior
set -g @yank_selection 'clipboard'
set -g @yank_with_mouse on
set -g set-clipboard on

# Open new window in the current directory
bind c new-window -c "#{pane_current_path}"

# Split panes in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Remove default split bindings
unbind '"'
unbind %

# Resize panes with Option + Shift + Arrow Keys
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5

# Navigate panes with prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Initialize TMUX plugin manager
# Keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
