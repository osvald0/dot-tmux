# Enable mouse support
set -g mouse on

# Increase history limit
set -g history-limit 100000

# Switch sessions instead of detaching when one is destroyed
set -g detach-on-destroy off

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'wfxr/tmux-fzf-url'

# Session persistence
set -g @resurrect-processes 'claude'
set -g @resurrect-hook-post-save-layout '~/.local/bin/tmux-resurrect-claude-save'

# Dracula theme configuration
# Empty space disables Dracula default right-side widgets:
# battery, network, weather
set -g @dracula-plugins " "
set -g status-right ''

# Improve yank behavior
set -g @yank_selection 'clipboard'
set -g @yank_with_mouse on
set -g set-clipboard on

# Open new window in the current directory
bind c new-window -c "#{pane_current_path}"

# Split panes in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Open Lazygit in a popup from the current directory
bind G display-popup -E -w 95% -h 95% -d "#{pane_current_path}" lazygit

# Remove default split bindings
unbind '"'
unbind %

# Resize panes with Option + Shift + Arrow Keys
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5

# Navigate panes with prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

set -g status-left ''
set -g status-style 'bg=#282a36,fg=#bfbfbf'
set -g status-bg '#282a36'
set -g status-fg '#bfbfbf'
set -g message-command-style 'bg=#282a36,fg=#ff79c6'
set -gw mode-style 'bg=#ff79c6,fg=#282a36,bold'
set -g window-status-separator '#[fg=#6272a4]|'

# Show the active pane's Claude Code state in its window tab
set -gw window-status-format '#[fg=#bfbfbf,bg=#282a36] #I:#W#{@claude_status_icon} '
set -gw window-status-current-format '#[fg=#{?client_prefix,#f1fa8c,#ff79c6},bg=#282a36,bold] #I:#W #[nobold]'
